# =============================================================================
# repo-delete (azure-nettools)
#
# DESTRUCTIVE. Deletes an entire repository -- every tag and every manifest --
# from an Azure Container Registry.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: repo-delete

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Image namespace. With artifactId this forms the repository <environment>/<artifactId>.'
        required: true
        type: choice
        options:
          - dev
          - lab
      confirm:
        description: >
          EVERY TAG AND MANIFEST IN THE REPOSITORY IS DELETED PERMANENTLY.
          There is no soft-delete and no recycle bin. Push anything you care
          about elsewhere first. Check this box to confirm.
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: repo-delete
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      registry-name: ${{ steps.registry.outputs.registry-name }}
    steps:
      - name: Resolve the registry name
        id: registry
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the registry name"
          echo "=============================================================="
          set -euo pipefail
          case "${{ inputs.environment }}" in
            dev) echo "registry-name=crrgomesdev01" >> "$GITHUB_OUTPUT" ;;
            lab) echo "registry-name=crrgomeslab02" >> "$GITHUB_OUTPUT" ;;
          esac

  delete:
    needs: registry
    if: ${{ inputs.confirm }}
    uses: rubensgomes-org/azure-workflows/.github/workflows/acr-repo-delete.yml@v0
    with:
      environment: ${{ inputs.environment }}
      registry-name: ${{ needs.registry.outputs.registry-name }}
      artifact-id: nettools
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    secrets:
      azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
