# =============================================================================
# Build and Deploy to ACA
#
# Provisions the Azure Container App and its dependencies (ACR, key vault,
# network) via the `azure-iac` repo's `aca-create.yml` workflow. Then builds
# the nettools container image, pushes it to the ACR, verifies the push,
# smoke-tests the image and purges the untagged manifests it orphaned.
# Finally updates the container app to run the newly published image.
#
# This project's source code and documentation were generated with the
# assistance of Artificial Intelligence (AI). For more information, please
# refer to the `AI_DISCLAIMER.md` document located in the project's root
# directory.
# =============================================================================
name: ACA Create and Deploy

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Image namespace, used as <environment>/<artifactId>:<tag>.'
        required: false
        default: dev
        type: choice
        options:
          - dev
          - lab
      tag:
        description: 'Image tag. Empty defaults to the version in VERSION.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-deploy
  cancel-in-progress: false

env:
  # NOTE: ALL container apps SHOULD use rg-<workload>app-<env>.
  RESOURCE_GROUP: rg-${{ vars.TF_VAR_WORKLOAD }}app-${{ inputs.environment_name }}
  CONTAINER_APP: ca-nettools-${{ inputs.environment_name }}

jobs:
  resolve-acr:
    name: Resolve the ACR registry name
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.resolve.outputs.acr_name }}
    steps:
      - id: resolve
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT_NAME" in
            dev) acr_name=crrgomesdev01 ;;
            lab) acr_name=crrgomeslab02 ;;
            *)
              echo "Unknown environment: '${ENVIRONMENT_NAME}'." >&2
              exit 1
              ;;
          esac
          echo "acr_name=${acr_name}" >> "$GITHUB_OUTPUT"
          echo "Resolved acr_name: ${acr_name}"

  check-aca:
    name: Check whether the ACA container app exists
    runs-on: ubuntu-latest
    outputs:
      aca_exists: ${{ steps.check.outputs.aca_exists }}
    steps:
      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Lists by name rather than `az containerapp show` so a missing resource
      # group is not an error, while Azure CLI failures still fail the job.
      - name: Check whether the container app exists
        id: check
        run: |
          echo "=============================================================="
          echo " STEP: Check whether the container app exists"
          echo "=============================================================="
          set -euo pipefail
          count="$(az resource list \
            --name "$CONTAINER_APP" \
            --resource-type Microsoft.App/containerApps \
            --query "length(@)" -o tsv)"
          aca_exists=false
          if [ "$count" -gt 0 ]; then
            aca_exists=true
          fi
          echo "aca_exists=${aca_exists}" >> "$GITHUB_OUTPUT"
          echo "Container app '${CONTAINER_APP}' exists: ${aca_exists}"

  create-aca:
    # this job creates ACA and all dependencies (ACR, KV, network...)
    name: Create ACA container app
    needs: [resolve-acr, check-aca]
    if: ${{ needs.check-aca.outputs.aca_exists != 'true' }}
    uses: rubensgomes-org/azure-iac/.github/workflows/aca-create.yml@v0
    with:
      environment_name: ${{ inputs.environment_name }}
      acr_name: ${{ needs.resolve-acr.outputs.acr_name }}
      apps: '["nettools"]'
    secrets:
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  build-push-image:
    name: Build and push image to ACR registry
    # wait for create-aca because we may need an ACR to be created as well
    needs: [resolve-acr, create-aca]
    # Runs when create-aca is skipped because the container app exists.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the application version
        id: version
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the application version"
          echo "=============================================================="
          set -euo pipefail
          echo "app-version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # No language-specific build step: the Dockerfile is the build.
      # smoke-entrypoint/smoke-args override the action's "--version" default,
      # which the nettools image (no ENTRYPOINT) does not support.
      - name: Publish the image to ACR
        uses: rubensgomes-org/azure-workflows/.github/actions/publish-acr-image@v0
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          registry-name: ${{ needs.resolve-acr.outputs.acr_name }}
          artifact-id: nettools
          environment: ${{ inputs.environment_name }}
          tag: ${{ inputs.tag }}
          app-version: ${{ steps.version.outputs.app-version }}
          smoke-entrypoint: bash
          smoke-args: -c true

  deploy-image:
    name: Deploy image to ACA container app
    needs: [resolve-acr, build-push-image]
    # A skipped create-aca would otherwise skip this job too.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: nettools
      ENVIRONMENT: ${{ inputs.environment_name }}
      REGISTRY_NAME: ${{ needs.resolve-acr.outputs.acr_name }}
    steps:
      - name: Sign in to Azure
        uses: rubensgomes-org/azure-workflows/.github/actions/azure-login@v0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure the container app is provisioned
        run: |
          echo "=============================================================="
          echo " STEP: Ensure the container app is provisioned"
          echo "=============================================================="
          set -euo pipefail
          if ! az containerapp show \
              -g "$RESOURCE_GROUP" \
              -n "$CONTAINER_APP" \
              --query name -o tsv >/dev/null; then
            echo "Container app '${CONTAINER_APP}' not found in resource" \
              "group '${RESOURCE_GROUP}' after the create-aca job." >&2
            exit 1
          fi

      - name: Resolve the published image reference
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "=============================================================="
          echo " STEP: Resolve the published image reference"
          echo "=============================================================="
          set -euo pipefail
          repository="${ENVIRONMENT}/${ARTIFACT_ID}"
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag="$(az acr repository show-tags \
              --name "$REGISTRY_NAME" \
              --repository "$repository" \
              --orderby time_desc --top 1 -o tsv)"
          fi
          login_server="$(az acr show \
            --name "$REGISTRY_NAME" \
            --query loginServer -o tsv)"
          image="${login_server}/${repository}:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${image}"

      - name: Update the container app with the new image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "=============================================================="
          echo " STEP: Update the container app with the new image"
          echo " az containerapp update -g ${RESOURCE_GROUP}" \
            "-n ${CONTAINER_APP} --image ${IMAGE}"
          echo "=============================================================="
          set -euo pipefail
          az containerapp update \
            -g "$RESOURCE_GROUP" \
            -n "$CONTAINER_APP" \
            --image "$IMAGE"
